<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLiTE Login</title>

<link href="https://googleapis.com" rel="stylesheet">

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #09131d;
    background-image: linear-gradient(rgba(9,19,29,.9), rgba(9,19,29,.95)), url("assets/background.jpg");
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.ipad-container {
    position: relative;
    width: 1000px;
    height: 700px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.background-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
}

.screen {
    position: absolute;
    top: 50%;
    left: 49.55%;
    transform: translate(-50%, -50%);
    width: 810px; /* Aligns app space nicely inside the iPad canvas */
    height: 605px;
    background: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
    overflow: hidden;
}

.login-container {
    width: 400%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.logo {
    width: 100px;
    height: auto;
    margin-bottom: 25px;
}

h1 {
    color: #4a4a4a;
    text-align: center;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: 0.5px;
    margin-bottom: 22px;
}

.input-group {
    width: 100%;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 11px;
    background: #ffffff;
    border: 1px solid #d1d1d6;
    border-radius: 6px;
    color: #000000;
    font-size: 15px;
    text-align: center;
    outline: none;
}

input::placeholder {
    color: #a9a9a9;
}

input:focus {
    border-color: #007aff;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #147efb;
    color: white;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 5px;
    transition: background 0.2s;
}

button:hover {
    background: #0062cc;
}

#error {
    margin-top: 10px;
    color: #ff3b30;
    text-align: center;
    font-size: 13px;
    display: none;
}

.footer-text {
    margin-top: 18px;
    color: #636366;
    font-size: 12px;
    text-align: center;
    line-height: 1.4;
}

.footer-text a {
    color: #147efb;
    text-transform: none;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="ipad-container">
    
    <img class="background-image" src="/images_/ipad.png" width="1000" height="700" alt="Background">

    <div class="screen">
        <div class="login-container">

            <img src="/images_/qps.png" class="logo" alt="QI Queensland Police">

            <h1>QLiTE</h1>

            <div class="input-group">
                <input id="username" type="text" placeholder="Username">
            </div>

            <div class="input-group">
                <input id="password" type="password" placeholder="Password">
            </div>

            <button onclick="login()">Log In</button>
             <p style="color: #8e8e93; font-size: 11px; margin-top: 10px;">OR</p>
              <button onclick="error()">Sign In With Discord</button>
            <div id="error">Incorrect username or password.</div>

            <div class="footer-text">
                <p>Contact Service Desk @ <a href="mailto:support@queenslandinteractive-rblx.com">support@queenslandinteractive-rblx.com</a></p>
                <p style="color: #8e8e93; font-size: 11px; margin-top: 2px;">Version 1.11 (2224)</p>
                <p style="color: #fa0404; font-size: 11px; margin-top: 15px;">Intended for Queensland Interactive Use ONLY.</p>
                <p style="color: #fa0404; font-size: 11px; margin-top: 2px;">Copyright © 2020 – 2026 Queensland Interactive. All Rights Reserved.</p>
            </div>
        </div>
    </div>
</div>

<script>
function login(){
    const USER = "admin";
    const PASS = "password";

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if(username === USER && password === PASS){
        sessionStorage.setItem("mdtLoggedIn","true");
        window.location.href = "dashboard.html";
    } else {
        document.getElementById("error").style.display="block";
    }
}
</script>

</body>
</html>
